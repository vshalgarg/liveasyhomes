spring:
  datasource:
    url: jdbc:h2:mem:liveasy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  storage:
    type: local
    local-dir: ${java.io.tmpdir}/liveasy-test-uploads
    public-base-url: http://localhost:8080
  otp:
    expose-in-response: true
