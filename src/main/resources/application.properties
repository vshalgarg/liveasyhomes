# Next.js should call this API with NEXT_PUBLIC_API_URL=http://localhost:8080
# Override secrets via the environment before any shared or production deploy.

spring.application.name=liveasyhomes-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/liveasyhomes}
spring.datasource.username=${DATABASE_USERNAME:liveasy}
spring.datasource.password=${DATABASE_PASSWORD:liveasy}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:dev-only-change-me-liveasyhomes-jwt-secret-32b}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
app.storage.type=${STORAGE_TYPE:r2}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:ap-south-1}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.bucket=${R2_BUCKET:properties-images}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:https://pub-af6312aedda949fabea67f9f24257c31.r2.dev}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.otp.expose-in-response=${OTP_EXPOSE:false}
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}



