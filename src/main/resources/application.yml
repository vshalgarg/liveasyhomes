# Next.js should call this API with NEXT_PUBLIC_API_URL=http://localhost:8080
# Override secrets via the environment before any shared or production deploy.

spring:
  application:
    name: liveasyhomes-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/liveasyhomes}
    username: ${DATABASE_USERNAME:liveasy}
    password: ${DATABASE_PASSWORD:liveasy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-liveasyhomes-jwt-secret-32b}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-south-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  otp:
    expose-in-response: ${OTP_EXPOSE:false}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
